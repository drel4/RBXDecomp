{% extends 'base.html' %}{% block body %}<h1>{{ _("Log in") }}</h1>
{% if error %}<p class="notice">{{ _(error) }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">
<label for="nickname">{{ _("Nickname") }}</label><input id="nickname" name="nickname" maxlength="20" autocomplete="username" value="{{ request.form.get('nickname','') }}" required>
<label for="password">{{ _("Password") }}</label><input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required>
<p><button>{{ _("Log in") }}</button></p></form>
<p>{{ _("Your session is saved for 30 days.") }} <a href="/signin">{{ _("Create an account") }}</a></p>
<p>{{ _("Lost your password? Ask the instance admin to reset it.") }}</p>{% endblock %}
