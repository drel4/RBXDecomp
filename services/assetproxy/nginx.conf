limit_req_zone $binary_remote_addr zone=blox_assets:10m rate=20r/s;
server {
    listen 80;
    server_name assetproxy.blox.ralsei.tech;
    access_log /var/log/nginx/openrbx-assets.access.log;
    location / {
        limit_except GET HEAD { deny all; }
        limit_req zone=blox_assets burst=60 nodelay;
        proxy_pass http://127.0.0.1:4381;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
    }
}
